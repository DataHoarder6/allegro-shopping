name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout web-agent (library dependency)
        uses: actions/checkout@v4
        with:
          repository: DataHoarder6/web-agent
          path: web-agent
          ssh-key: ${{ secrets.WEB_AGENT_DEPLOY_KEY }}
      - name: Checkout allegro-shopping
        uses: actions/checkout@v4
        with:
          path: allegro-shopping
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Install dependencies
        run: uv sync
        working-directory: allegro-shopping
      - name: Lint
        run: uv run ruff check .
        working-directory: allegro-shopping
      - name: Types
        run: uv run mypy
        working-directory: allegro-shopping
      - name: Tests + coverage gate
        run: uv run pytest --cov
        working-directory: allegro-shopping
