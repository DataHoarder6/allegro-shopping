# A request is what you want bought. Caps are hard gates.
# Copy, edit, then: allegro-shop plan config/my-request.toml

[meta]
name = "Wago junction box restock"
notes = "rebuilding the garage junction box; buy only genuine WAGO"

[[items]]
label = "wago-3"
query = "wago 221-413"
quantity = 2
# Grosze. The gate compares the offer price (not landed) against this.
